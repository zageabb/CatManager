schema_version: 1
application:
  name: catmanager
  display_name: CatManager
  group: TAIJU - Development
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt", "gunicorn"]
service:
  type: systemd
  entrypoint: ["gunicorn", "--workers", "1", "--timeout", "180", "--bind", "0.0.0.0:5088", "app:app"]
  port: 5088
  health_path: /
proxy:
  enabled: true
  path: /apps/catmanager/
  authentication: uda
environment:
  required:
    - CATMANAGER_CSRF_ENABLED
    - CATMANAGER_REQUIRE_STRONG_SECRET
    - CATMANAGER_SECRET_KEY
deployment:
  auto_update: true
  rollback: true
  github_reporting: false

